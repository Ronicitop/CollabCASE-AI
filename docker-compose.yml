services:
  postgres:
    image: postgres:17-alpine
    container_name: collabcase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabcase_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Puerto 5433 en host para evitar conflicto con PostgreSQL local en 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collabcase_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collabcase-network

  backend:
    build:
      context: ./backend/collabcase-backend
      dockerfile: Dockerfile
    container_name: collabcase-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-collabcase_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://192.168.0.9:3000,http://192.168.0.9:5173}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-collabcase-gpt}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      JAVA_OPTS: "-Dfile.encoding=UTF-8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - collabcase-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://192.168.0.9:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://192.168.0.9:8080}
    container_name: collabcase-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - collabcase-network

volumes:
  postgres_data:
    name: collabcase_postgres_data

networks:
  collabcase-network:
    name: collabcase-network
    driver: bridge
