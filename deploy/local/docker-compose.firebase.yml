# Usar junto al compose raíz. El JSON privado queda fuera del repositorio.
services:
  backend:
    environment:
      PUSH_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - type: bind
        source: ${FIREBASE_ADMIN_FILE:?Define FIREBASE_ADMIN_FILE con la ruta absoluta del JSON privado}
        target: /run/secrets/firebase-admin.json
        read_only: true
