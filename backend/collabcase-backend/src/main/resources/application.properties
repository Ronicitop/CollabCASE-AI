spring.application.name=collabcase-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collabcase_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=${PORT:8080}

# OpenAI
openai.api-key=${AZURE_OPENAI_API_KEY:}
openai.model=${AZURE_OPENAI_DEPLOYMENT:collabcase-gpt}
openai.base-url=${AZURE_OPENAI_BASE_URL:https://collabcase-openai-2026-05452.openai.azure.com/openai/v1/responses}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
