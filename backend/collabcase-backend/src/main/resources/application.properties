spring.application.name=collabcase-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/collabcase_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/responses}